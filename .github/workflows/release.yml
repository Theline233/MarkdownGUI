name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            sidecarExt: .exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb appimage
            sidecarExt: ""
          - platform: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
            sidecarExt: ""
          - platform: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            sidecarExt: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build parser sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src-tauri/requirements.txt pyinstaller
          python -m PyInstaller --onefile --name engine-server src-tauri/engine_server.py

          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $source = "dist/engine-server${{ matrix.sidecarExt }}"
          $target = "src-tauri/binaries/engine-server-${{ matrix.target }}${{ matrix.sidecarExt }}"
          Move-Item -Force $source $target

          if ("${{ runner.os }}" -ne "Windows") {
            chmod +x $target
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: markdown-gui-v__VERSION__
          releaseName: "MarkdownGUI v__VERSION__"
          releaseBody: "MarkdownGUI desktop release."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
