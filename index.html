<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkdownGUI</title>
    <style>
      #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #ffffff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }

      .splash-title {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a2e;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }

      .splash-subtitle {
        font-size: 13px;
        color: rgba(0, 0, 0, 0.4);
        letter-spacing: 0.05em;
        margin-bottom: 0;
      }

      .splash-progress-wrap {
        position: absolute;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 2px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }

      .splash-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4f8ef7, #a78bfa);
        border-radius: 2px;
        transition: width 0.15s ease;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-title">MarkdownGUI</div>
      <div class="splash-subtitle">智能文档解析工作台</div>
      <div class="splash-progress-wrap">
        <div class="splash-progress-bar" id="splash-bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const bar = document.getElementById('splash-bar')
      const steps = [20, 40, 60, 75, 85, 92]
      let i = 0
      const timer = setInterval(() => {
        if (i < steps.length) {
          bar.style.width = steps[i++] + '%'
        } else {
          clearInterval(timer)
        }
      }, 200)

      window.__hideSplash = function() {
        clearInterval(timer)
        bar.style.width = '100%'
        setTimeout(() => {
          const splash = document.getElementById('splash')
          if (splash) {
            splash.style.opacity = '0'
            setTimeout(() => splash.remove(), 400)
          }
        }, 150)
      }
    </script>
  </body>
</html>
